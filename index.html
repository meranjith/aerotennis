<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroTennis | Cyberpunk Audio Sport</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-cyan: #00ffff;
            --bg-dark: #0a0a0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            text-align: center;
        }
        h1 { color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-cyan); }
        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        
        button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 30px;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            transition: 0.3s;
        }
        button:hover, button:active { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); }
        input {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
            outline: none;
        }
        .status { margin-top: 20px; color: var(--neon-cyan); font-size: 1.2rem; }
        .score-board { font-size: 2rem; color: var(--neon-green); margin-bottom: 20px; letter-spacing: 2px; }
        .warning { color: #ff0055; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="menuScreen" class="screen active">
        <h1>AeroTennis</h1>
        <p class="warning">⚠️ STEREO HEADPHONES STRICTLY MANDATORY</p>
        <p class="warning">Hold phone horizontally.</p>
        <button onclick="startGame(true)">Wall Mode (Practice)</button>
        <button onclick="showMultiplayer()">Multiplayer</button>
    </div>

    <div id="lobbyScreen" class="screen">
        <h1>Net-Link</h1>
        <button onclick="createMatch()">Create Match</button>
        <p style="margin: 15px 0;">OR</p>
        <input type="text" id="joinCode" placeholder="Enter 6-Digit Code" maxlength="6">
        <button onclick="joinMatch()">Join Match</button>
        <button onclick="switchScreen('menuScreen')" style="border-color: gray; color: gray;">Back</button>
        <p id="lobbyStatus" class="status"></p>
    </div>

    <div id="gameScreen" class="screen">
        <div class="score-board" id="scoreBoard">0 - 0</div>
        <p id="gameStatus" class="status">Waiting to serve...</p>
        <div style="margin-top: 50px; font-size: 0.8rem; color: gray;">
            Left Ball = Screen Facing YOU<br>
            Right Ball = Screen Facing AWAY<br>
            Swing forward to hit!
        </div>
    </div>

<script>
/**
 * CORE ARCHITECTURE
 */
const UI = {
    switch: (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    },
    setStatus: (text) => document.getElementById('gameStatus').innerText = text,
    setScore: (p1, p2) => document.getElementById('scoreBoard').innerText = `${p1} - ${p2}`,
    setLobbyStatus: (text) => document.getElementById('lobbyStatus').innerText = text
};

function switchScreen(id) { UI.switch(id); }

/**
 * WAKE LOCK API
 */
let wakeLock = null;
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Screen Wake Lock active');
        } catch (err) { console.error('Wake Lock error:', err); }
    }
}

/**
 * AUDIO ENGINE (Web Audio API & Synthetic Sounds)
 */
class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }

    async init() {
        if (this.ctx.state === 'suspended') await this.ctx.resume();
    }

    // Umpire Voice
    speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.1;
        utterance.pitch = 0.9;
        speechSynthesis.speak(utterance);
    }

    // Synthetic Ball Approach (Swoosh getting louder)
    playBallApproach(side, durationMs) {
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();
        const panner = this.ctx.createStereoPanner();

        // White noise approximation using rapid frequency modulation
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + (durationMs / 1000));

        // Spatial Panning: -1 is Left, 1 is Right
        panner.pan.value = side;

        // Volume Envelope (Starts quiet, gets loud, drops off)
        gainNode.gain.setValueAtTime(0.01, this.ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(1, this.ctx.currentTime + (durationMs / 1000) - 0.1);
        gainNode.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (durationMs / 1000));

        osc.connect(panner);
        panner.connect(gainNode);
        gainNode.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + (durationMs / 1000));
    }

    // Hit / Miss SFX
    playSFX(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        const now = this.ctx.currentTime;
        if (type === 'perfect') {
            // Loud Crack
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'poor') {
            // Muffled thwack
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'miss') {
            // Whiff and bounce
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }
}

const audio = new AudioEngine();

/**
 * MOTION ENGINE
 */
class MotionEngine {
    constructor(onSwing) {
        this.onSwing = onSwing;
        this.lastSwing = 0;
    }

    async requestPermissions() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceMotionEvent.requestPermission();
                if (permission !== 'granted') throw new Error("Permission denied");
            } catch (e) {
                alert("Motion permissions are required to play!");
                return false;
            }
        }
        this.startListening();
        return true;
    }

    startListening() {
        window.addEventListener('devicemotion', (e) => {
            if (!e.acceleration || !e.accelerationIncludingGravity) return;
            
            // Calculate pure acceleration magnitude for the swing force
            const acc = e.acceleration;
            const force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);

            // Use gravity Z-axis to determine if screen is facing user or away
            // Positive Z generally means screen is facing up/towards user.
            // Negative Z means screen is facing down/away from user.
            const zGravity = e.accelerationIncludingGravity.z;
            const isScreenFacingUser = zGravity > 0;

            // Threshold for a swing (requires testing on physical device, 15 is a solid starting point)
            if (force > 15 && Date.now() - this.lastSwing > 800) {
                this.lastSwing = Date.now();
                this.onSwing(isScreenFacingUser);
            }
        });
    }
}

/**
 * GAME LOGIC & SCORING
 */
class GameEngine {
    constructor(isHost, isPractice) {
        this.isHost = isHost;
        this.isPractice = isPractice;
        this.scores = { host: 0, guest: 0 };
        this.scoreMap = [0, 15, 30, 40, 'Game'];
        
        this.state = 'IDLE'; // IDLE, SERVING, IN_PLAY
        this.server = 'host';
        this.ballInFlight = false;
        this.expectedSide = null; // -1 (Left), 1 (Right)
        this.ballArrivalTime = 0;
        
        this.motion = new MotionEngine(this.handleSwing.bind(this));
    }

    async init() {
        await audio.init();
        await requestWakeLock();
        const motionGranted = await this.motion.requestPermissions();
        if (motionGranted) {
            UI.switch('gameScreen');
            if (this.isHost || this.isPractice) {
                setTimeout(() => this.announceScoreAndServe(), 1000);
            }
        }
    }

    announceScoreAndServe() {
        let text = "";
        if (this.scores.host === 40 && this.scores.guest === 40) {
            text = "Deuce.";
        } else {
            text = `${this.scores.host} - ${this.scores.guest}.`;
        }
        
        let serverName = this.server === (this.isHost ? 'host' : 'guest') ? "Your turn to serve." : "Opponent to serve.";
        if (this.isPractice) serverName = "Your turn to serve.";

        audio.speak(`${text} ${serverName}`);
        UI.setStatus(serverName);

        // Wait for announcement to finish before allowing serve
        setTimeout(() => {
            this.state = 'SERVING';
            if (this.server === (this.isHost ? 'host' : 'guest') || this.isPractice) {
                UI.setStatus("Swing to Serve!");
            }
        }, 3000);
    }

    handleSwing(isScreenFacingUser) {
        if (this.state === 'SERVING' && (this.server === (this.isHost ? 'host' : 'guest') || this.isPractice)) {
            // Serve the ball
            this.state = 'IN_PLAY';
            this.hitBall('perfect');
            return;
        }

        if (this.state === 'IN_PLAY' && this.ballInFlight) {
            // Check logic: 
            // Left Ball (-1) -> Screen Facing User (true)
            // Right Ball (1) -> Screen Facing Away (false)
            const sideCorrect = (this.expectedSide === -1 && isScreenFacingUser) || 
                                (this.expectedSide === 1 && !isScreenFacingUser);
            
            const timeDiff = Math.abs(Date.now() - this.ballArrivalTime);
            
            if (sideCorrect && timeDiff < 400) { // Sweet spot (400ms window)
                let quality = timeDiff < 150 ? 'perfect' : 'poor';
                this.hitBall(quality);
            } else {
                this.missBall();
            }
        }
    }

    hitBall(quality) {
        this.ballInFlight = false;
        audio.playSFX(quality);
        UI.setStatus("Hit!");
        
        // Randomize trajectory for opponent
        const nextSide = Math.random() > 0.5 ? -1 : 1; 

        if (this.isPractice) {
            // Wall mode: ball comes right back after a delay
            setTimeout(() => this.receiveBall(nextSide), 1000);
        } else {
            // Multiplayer: Send to opponent
            network.send({ type: 'HIT', side: nextSide });
        }
    }

    receiveBall(side) {
        this.state = 'IN_PLAY';
        this.ballInFlight = true;
        this.expectedSide = side;
        
        const travelTime = 1200; // ms
        this.ballArrivalTime = Date.now() + travelTime;
        
        audio.playBallApproach(side, travelTime);
        UI.setStatus(side === -1 ? "Ball approaching Left!" : "Ball approaching Right!");
        
        // Auto-miss if player doesn't swing
        setTimeout(() => {
            if (this.ballInFlight) this.missBall();
        }, travelTime + 400); 
    }

    missBall() {
        if (!this.ballInFlight) return;
        this.ballInFlight = false;
        audio.playSFX('miss');
        
        // Point goes to whoever DID NOT just miss
        const winner = this.server === (this.isHost ? 'host' : 'guest') ? 'guest' : 'host';
        this.awardPoint(winner);
    }

    awardPoint(player) {
        this.state = 'IDLE';
        // Simplified Tennis Scoring logic for demonstration
        if (this.scores[player] === 30) this.scores[player] = 40;
        else if (this.scores[player] === 40) {
            // simplified game win
            UI.setStatus("GAME OVER");
            audio.speak("Game.");
            setTimeout(() => location.reload(), 3000);
            return;
        } else {
            this.scores[player] += 15;
        }

        UI.setScore(this.scores.host, this.scores.guest);
        
        if (!this.isPractice) {
            network.send({ type: 'SCORE', scores: this.scores });
        }
        
        // Alternate server logic goes here (simplified to always alternate for now)
        this.server = this.server === 'host' ? 'guest' : 'host';
        setTimeout(() => this.announceScoreAndServe(), 2000);
    }
}

/**
 * MULTIPLAYER ENGINE (PeerJS) - UPDATED FOR STABILITY
 */
let network = null;
let game = null;

class Multiplayer {
    constructor() {
        this.myId = Math.floor(100000 + Math.random() * 900000).toString();
        
        // FIX 1: Added Google STUN servers to punch through mobile/Wi-Fi firewalls
        this.peer = new Peer(this.myId, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            },
            debug: 2
        });
        
        this.conn = null;
        this.isReady = false;
        
        this.peer.on('open', (id) => {
            console.log('Peer connected to server. ID:', id);
            this.isReady = true;
            // If the user already clicked Create Match before it was ready, update UI now
            if(document.getElementById('lobbyStatus').innerText === "Generating secure code...") {
                UI.setLobbyStatus(`Share this code: ${this.myId}`);
            }
        });

        // FIX 2: Added error handling so the UI doesn't freeze in silence
        this.peer.on('error', (err) => {
            console.error("PeerJS Error:", err);
            let errMsg = "Connection Failed.";
            if (err.type === 'peer-unavailable') errMsg = "Code not found! Did the host create the match?";
            else if (err.type === 'network') errMsg = "Lost connection to server.";
            UI.setLobbyStatus(errMsg);
        });

        // Handle incoming connection (Host)
        this.peer.on('connection', (connection) => {
            this.conn = connection;
            this.setupConnection(true);
        });
    }

    connect(peerId) {
        if (!this.isReady) {
            UI.setLobbyStatus("Still connecting to server, try again in a second...");
            return;
        }
        
        // FIX 3: Forced reliable data channel
        this.conn = this.peer.connect(peerId, { reliable: true });
        this.setupConnection(false);
    }

    setupConnection(isHost) {
        this.conn.on('open', () => {
            UI.setLobbyStatus("Connected! Starting game...");
            setTimeout(() => {
                game = new GameEngine(isHost, false);
                game.init();
            }, 1500);
        });

        this.conn.on('data', (data) => {
            if (data.type === 'HIT') {
                game.receiveBall(data.side);
            } else if (data.type === 'SCORE') {
                game.scores = data.scores;
                UI.setScore(game.scores.host, game.scores.guest);
            }
        });
    }

    send(data) {
        if (this.conn && this.conn.open) {
            this.conn.send(data);
        }
    }
}

/**
 * UI BINDINGS - UPDATED
 */
function startGame(isPractice) {
    if (isPractice) {
        game = new GameEngine(true, true);
        game.init();
    }
}

function showMultiplayer() {
    UI.switch('lobbyScreen');
    if (!network) {
        UI.setLobbyStatus("Connecting to multiplayer server...");
        network = new Multiplayer();
        setTimeout(() => {
            if(network.isReady) UI.setLobbyStatus("");
        }, 1000);
    }
}

function createMatch() {
    if (network && network.isReady) {
        UI.setLobbyStatus(`Share this code: ${network.myId}`);
    } else {
        UI.setLobbyStatus("Generating secure code...");
    }
}

function joinMatch() {
    const code = document.getElementById('joinCode').value;
    if (code.length === 6) {
        UI.setLobbyStatus("Finding opponent...");
        network.connect(code);
    } else {
        UI.setLobbyStatus("Please enter a 6-digit code.");
    }
}


</script>
</body>
</html>
