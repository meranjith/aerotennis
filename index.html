<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AeroTennis | Precision Audio-Motion Tennis</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #030508;
      --panel: #090e17;
      --cyan: #00f3ff;
      --green: #39ff14;
      --red: #ff0055;
      --yellow: #ffd700;
      --dim: #5c6f84;
      --border: #142033;
      --font: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: var(--font);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 94%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.12);
      max-height: 96vh;
      overflow-y: auto;
    }

    h1 {
      font-size: 2.1rem;
      letter-spacing: 4px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0, 243, 255, 0.5);
      margin-bottom: 2px;
    }

    .sub {
      font-size: 0.70rem;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    /* Live Sensor Visualizer */
    .sensor-tester {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: left;
    }

    .tester-title {
      font-size: 0.72rem;
      color: var(--yellow);
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    .stance-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
      margin-bottom: 6px;
      background: #111;
      border: 1px solid #333;
      color: #666;
      transition: all 0.15s;
    }

    .stance-badge.forehand {
      background: rgba(57, 255, 20, 0.15);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
    }

    .stance-badge.backhand {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .meter-container {
      width: 100%;
      height: 10px;
      background: #111822;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #223147;
    }

    .meter-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.05s linear;
    }

    .audio-test-box {
      background: rgba(255, 215, 0, 0.06);
      border: 1px solid var(--yellow);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
    }

    .status-panel {
      font-size: 0.80rem;
      color: var(--dim);
      border: 1px dashed var(--border);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: inherit;
      padding: 12px;
      font-size: 0.90rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      margin: 4px 0;
    }
    .btn:active {
      background: var(--cyan);
      color: var(--bg);
    }

    .btn-green {
      border-color: var(--green);
      color: var(--green);
    }
    .btn-green:active {
      background: var(--green);
      color: var(--bg);
    }

    .btn-yellow {
      border-color: var(--yellow);
      color: var(--yellow);
      font-size: 0.72rem;
      padding: 6px;
    }

    .code-input {
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: var(--green);
      font-size: 1.10rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 4px;
      border-radius: 6px;
      margin: 5px 0;
      text-transform: uppercase;
      outline: none;
    }
    .code-input:focus { border-color: var(--cyan); }

    /* IN-GAME MINIMALIST CYBER HUD */
    #hud {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 44px 20px;
      text-align: center;
    }

    .hud-header {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--dim);
    }

    .hud-score {
      font-size: 2.8rem;
      letter-spacing: 6px;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan);
      margin: 8px 0;
    }

    .hud-turn {
      font-size: 1rem;
      color: var(--green);
      letter-spacing: 2px;
    }

    .hud-feedback {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #fff;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .hud-telemetry {
      font-size: 0.75rem;
      color: var(--dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .hud-quit {
      border: 1px solid var(--red);
      color: var(--red);
      background: transparent;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container" id="lobby">
    <h1>AEROTENNIS</h1>
    <div class="sub">Kinematic Spatial Motion Tennis</div>

    <!-- Live Grip & Motion Calibrator -->
    <div class="sensor-tester">
      <div class="tester-title">
        <span>LIVE MOTION & GRIP TESTER</span>
        <span id="testPwr">0.0 m/s²</span>
      </div>
      <div class="stance-badge" id="stanceBadge">TAP "ACTIVATE SENSORS" BELOW</div>
      <div class="meter-container">
        <div class="meter-bar" id="meterBar"></div>
      </div>
    </div>

    <button class="btn btn-yellow" id="btnInitSensors">1. ACTIVATE & TEST SENSORS</button>

    <div class="audio-test-box">
      <div style="font-size:0.72rem; color:var(--yellow); margin-bottom:4px;">
        🎧 <b>STEREO EARPHONES TEST</b>
      </div>
      <button class="btn btn-yellow" id="btnAudioTest">Play Left/Right Audio Channels</button>
    </div>

    <div class="status-panel" id="statusText">Hold Phone in Right Hand like a Racket</div>

    <button class="btn btn-green" id="btnWall">Solo Wall Practice</button>
    <button class="btn" id="btnCreate">Create 2-Player Match</button>
    <input type="text" id="roomInput" class="code-input" placeholder="ROOM CODE" maxlength="6" />
    <button class="btn" id="btnJoin">Join Match</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div>
      <div class="hud-header" id="hudMode">ARENA</div>
      <div class="hud-score" id="hudScore">0 - 0</div>
      <div class="hud-turn" id="hudServer">INITIALIZING</div>
    </div>
    <div class="hud-feedback">
      <div id="hudFeedbackMain">HOLD READY</div>
      <div class="hud-telemetry" id="hudTelemetry">STANDBY</div>
    </div>
    <button class="hud-quit" id="btnQuit">EXIT MATCH</button>
  </div>

<script>
/**
 * 1. SYNTHETIC AUDIO ENGINE
 */
class AudioEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTestTone(dir, freq, onDone) {
    this.init();
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const panner = this.ctx.createStereoPanner();

    osc.frequency.setValueAtTime(freq, t0);
    panner.pan.setValueAtTime(dir, t0);
    gain.gain.setValueAtTime(0.3, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);

    osc.connect(gain);
    gain.connect(panner);
    panner.connect(this.ctx.destination);

    osc.start(t0);
    osc.stop(t0 + 0.36);
    setTimeout(onDone, 400);
  }

  playBallApproach(direction, duration) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const tEnd = t0 + duration;

    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(360, t0);
    filter.frequency.exponentialRampToValueAtTime(940, tEnd);
    filter.Q.setValueAtTime(4.0, t0);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.01, t0);
    gain.gain.exponentialRampToValueAtTime(1.0, tEnd);

    const panner = this.ctx.createStereoPanner();
    panner.pan.setValueAtTime(direction, t0);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(panner);
    panner.connect(this.ctx.destination);

    noise.start(t0);
    noise.stop(tEnd + 0.05);
  }

  playHit() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(650, t0);
    osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.08);
    g.gain.setValueAtTime(1.0, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.09);

    const pop = this.ctx.createOscillator();
    const pg = this.ctx.createGain();
    pop.type = 'sine';
    pop.frequency.setValueAtTime(160, t0);
    pop.frequency.linearRampToValueAtTime(40, t0 + 0.05);
    pg.gain.setValueAtTime(0.8, t0);
    pg.gain.linearRampToValueAtTime(0.001, t0 + 0.05);
    pop.connect(pg);
    pg.connect(this.ctx.destination);
    pop.start(t0);
    pop.stop(t0 + 0.06);
  }

  playWhiff() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.16);
    g.gain.setValueAtTime(0.35, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.17);
  }

  playBounce() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(160, t0);
    osc.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
    g.gain.setValueAtTime(0.6, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.13);
  }
}

/**
 * 2. ATTITUDE-BASED MOTION SENSOR FUSION ENGINE
 * Uses 3D Kinetic Magnitude (always positive) + Attitude Orientation Matrix.
 * Works 100% reliably regardless of wrist angle, cross-body pull, or centrifugal arc.
 */
class SensorFusionMotionEngine {
  constructor(onSwing, onTelemetryUpdate = null) {
    this.onSwing = onSwing;
    this.onTelemetryUpdate = onTelemetryUpdate;
    this.active = false;
    this.lockoutUntil = 0;

    // Dynamic high-pass filter to strip static gravity from magnitude
    this.filteredMag = 0;
    this.alpha = 0.85;

    // Current Physical Stance: 'FOREHAND' (Screen forward) or 'BACKHAND' (Back panel forward)
    this.currentStance = 'FOREHAND';

    // Total Kinetic Threshold: 7.0 m/s^2 total 3D acceleration spike
    this.SWING_POWER_THRESHOLD = 7.0;

    this.onMotion = this.onMotion.bind(this);
    this.onOrientation = this.onOrientation.bind(this);
  }

  async requestPermission() {
    let granted = true;
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const res = await DeviceMotionEvent.requestPermission();
        granted = (res === 'granted');
      } catch (e) {
        granted = false;
      }
    }
    if (granted && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        await DeviceOrientationEvent.requestPermission();
      } catch (e) {}
    }
    return granted;
  }

  start() {
    this.active = true;
    this.lockoutUntil = 0;
    this.filteredMag = 0;
    window.addEventListener('devicemotion', this.onMotion, false);
    window.addEventListener('deviceorientation', this.onOrientation, false);
  }

  stop() {
    this.active = false;
    window.removeEventListener('devicemotion', this.onMotion, false);
    window.removeEventListener('deviceorientation', this.onOrientation, false);
  }

  /**
   * ATTITUDE MATRIX:
   * When holding the phone horizontally (Landscape) in the Right Hand:
   * 
   * 1. FOREHAND STANCE (Screen outward):
   *    Gamma (roll angle) is around 0° to -40° or +30°. 
   *    Z-axis gravity points outward or neutral.
   * 
   * 2. BACKHAND STANCE (Cross-body wrist flip):
   *    The wrist rolls over so the screen faces YOUR chest/face.
   *    Gamma tilts significantly (> +45° or < -45°), or Z gravity goes strongly negative.
   */
  onOrientation(e) {
    if (e.gamma === null) return;

    const gamma = e.gamma; // Roll angle: -90 to +90
    const beta = e.beta;   // Pitch angle: -180 to +180

    // When the wrist flips across the body for a backhand, gamma flips past 35 degrees
    // or the phone rotates so the screen points inwards toward the user.
    if (Math.abs(gamma) > 35 || beta > 110 || beta < -20) {
      this.currentStance = 'BACKHAND';
    } else {
      this.currentStance = 'FOREHAND';
    }

    if (this.onTelemetryUpdate) {
      this.onTelemetryUpdate(this.currentStance, 0);
    }
  }

  onMotion(e) {
    if (!this.active) return;

    let ax = 0, ay = 0, az = 0;

    if (e.acceleration && e.acceleration.x !== null && !isNaN(e.acceleration.x)) {
      ax = e.acceleration.x;
      ay = e.acceleration.y;
      az = e.acceleration.z;
    } else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) {
      ax = e.accelerationIncludingGravity.x;
      ay = e.accelerationIncludingGravity.y;
      az = e.accelerationIncludingGravity.z;
    }

    // 3D Kinetic Magnitude (Total vector energy) - Mathematically ALWAYS positive
    const rawMag = Math.sqrt(ax * ax + ay * ay + az * az);

    // Dynamic Gravity Stripping: Removes 9.8 m/s^2 earth baseline
    this.filteredMag = this.alpha * this.filteredMag + (1 - this.alpha) * rawMag;
    const dynamicPower = Math.max(0, rawMag - this.filteredMag);

    if (this.onTelemetryUpdate) {
      this.onTelemetryUpdate(this.currentStance, dynamicPower);
    }

    const now = performance.now();
    if (now < this.lockoutUntil) return;

    // Trigger Swing on Total Kinetic Power
    if (dynamicPower >= this.SWING_POWER_THRESHOLD) {
      this.lockoutUntil = now + 650; // Lock out braking follow-through

      // Stance dictates whether the strike is Screen (Forehand) or Back Panel (Backhand)
      const face = (this.currentStance === 'FOREHAND') ? 'SCREEN' : 'BACK_PANEL';
      this.onSwing(face, dynamicPower);
    }
  }
}

/**
 * 3. AUTHORITATIVE TENNIS MATCH CONTROLLER
 */
class TennisMatchController {
  constructor(audio, role, sendPacket, motionEngine) {
    this.audio = audio;
    this.role = role;
    this.sendPacket = sendPacket;
    this.motion = motionEngine;

    this.points = [0, 0];
    this.games = [0, 0];
    this.server = 0;

    this.state = 'IDLE'; // 'IDLE', 'AWAITING_SERVE', 'BALL_APPROACH', 'STRIKE_ZONE'
    this.expectedDirection = null; // -1: Left (Backhand), 1: Right (Forehand)
    this.flightTime = 1.35;
    this.ballStartTime = 0;
    this.hitMargin = 0.48; // Generous 480ms sweet spot margin
    this.missTimeout = null;
    this.strikeZoneTimeout = null;
  }

  getScoreStr() {
    const p1 = this.points[0];
    const p2 = this.points[1];

    if (p1 >= 3 && p2 >= 3) {
      if (p1 === p2) return "Deuce";
      if (p1 === p2 + 1) return this.server === 0 ? "Advantage Server" : "Advantage Receiver";
      if (p2 === p1 + 1) return this.server === 1 ? "Advantage Server" : "Advantage Receiver";
    }

    const terms = ["Love", "15", "30", "40"];
    const serverScore = this.server === 0 ? terms[p1] : terms[p2];
    const receiverScore = this.server === 0 ? terms[p2] : terms[p1];
    return `${serverScore} - ${receiverScore}`;
  }

  updateHUD(mainText = "", telemetryText = "") {
    document.getElementById('hudScore').innerText = this.getScoreStr();
    const isMyServe = (this.role === 'GUEST') ? (this.server === 1) : (this.server === 0);
    document.getElementById('hudServer').innerText = isMyServe ? "YOUR SERVE" : "RECEIVING";
    if (mainText) document.getElementById('hudFeedbackMain').innerText = mainText;
    if (telemetryText) document.getElementById('hudTelemetry').innerText = telemetryText;
  }

  speak(text, cb) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      let done = false;
      const wrap = () => { if (!done) { done = true; if (cb) cb(); } };
      u.onend = wrap;
      u.onerror = wrap;
      setTimeout(wrap, 2000);
      window.speechSynthesis.speak(u);
    } else {
      if (cb) setTimeout(cb, 1000);
    }
  }

  start() {
    this.updateHUD("MATCH COMMENCING");
    this.speak("Match commenced. " + (this.server === 0 ? "You serve." : "Opponent serves."), () => {
      this.initiatePoint();
    });
  }

  initiatePoint() {
    this.state = 'IDLE';
    clearTimeout(this.missTimeout);
    clearTimeout(this.strikeZoneTimeout);
    this.updateHUD("POINT SETUP", "");

    setTimeout(() => {
      const isMyServe = (this.role === 'GUEST') ? (this.server === 1) : (this.server === 0);

      if (isMyServe) {
        this.state = 'AWAITING_SERVE';
        this.updateHUD("YOUR SERVE", "SWING TO STRIKE");
      } else {
        this.updateHUD("RECEIVING", "AWAITING OPPONENT SERVE");
        if (this.role === 'WALL') {
          setTimeout(() => {
            const serveDir = Math.random() > 0.5 ? 1 : -1;
            this.receiveBall(serveDir, 1.35);
          }, 1200);
        } else if (this.role === 'HOST') {
          this.sendPacket({ type: 'CMD_SERVE' });
        }
      }
    }, 1200);
  }

  receiveBall(dir, dur) {
    this.state = 'BALL_APPROACH';
    clearTimeout(this.missTimeout);
    clearTimeout(this.strikeZoneTimeout);

    this.expectedDirection = dir;
    this.flightTime = dur;
    this.ballStartTime = performance.now();

    this.audio.playBallApproach(dir, dur);
    this.updateHUD(
      dir === 1 ? "FOREHAND (RIGHT)" : "BACKHAND (LEFT)",
      "PREPARE STANCE"
    );

    // Strike Zone opens when ball is close
    const timeUntilStrikeZone = Math.max(0, (dur - this.hitMargin) * 1000);
    this.strikeZoneTimeout = setTimeout(() => {
      if (this.state === 'BALL_APPROACH') {
        this.state = 'STRIKE_ZONE';
        this.updateHUD(
          dir === 1 ? "FOREHAND (RIGHT)" : "BACKHAND (LEFT)",
          "SWEET SPOT - HIT NOW!"
        );
      }
    }, timeUntilStrikeZone);

    // Miss Timeout
    this.missTimeout = setTimeout(() => {
      if (this.state === 'BALL_APPROACH' || this.state === 'STRIKE_ZONE') {
        this.handleMiss("TOO LATE - MISSED BALL");
      }
    }, (dur + this.hitMargin) * 1000);
  }

  onSwing(face, forceVal) {
    // 1. Serving
    if (this.state === 'AWAITING_SERVE') {
      this.state = 'IDLE';
      this.audio.playHit();
      this.updateHUD("SERVE STRUCK!", `POWER: ${forceVal.toFixed(1)} [${face}]`);

      if (this.role === 'WALL') {
        setTimeout(() => this.audio.playBounce(), 450);
        setTimeout(() => {
          const nextDir = Math.random() > 0.5 ? 1 : -1;
          this.receiveBall(nextDir, 1.30);
        }, 900);
      } else {
        const nextDir = Math.random() > 0.5 ? 1 : -1;
        this.sendPacket({ type: 'BALL', direction: nextDir, duration: 1.30 });
      }
      return;
    }

    // 2. Early Preparation Window Immunity
    if (this.state === 'BALL_APPROACH') {
      const elapsed = (performance.now() - this.ballStartTime) / 1000;
      if (elapsed < (this.flightTime - this.hitMargin - 0.20)) {
        // Player is crossing arm or twisting wrist: IGNORE
        return;
      }
      this.audio.playWhiff();
      this.handleMiss("TOO EARLY!", `SWUNG AT ${elapsed.toFixed(2)}s`);
      return;
    }

    // 3. Strike Zone Execution
    if (this.state === 'STRIKE_ZONE') {
      clearTimeout(this.missTimeout);
      clearTimeout(this.strikeZoneTimeout);
      this.state = 'IDLE';

      // Verify Stance:
      // Right Ear = Screen forward (FOREHAND)
      // Left Ear = Back panel forward (BACKHAND)
      const targetFace = (this.expectedDirection === 1) ? 'SCREEN' : 'BACK_PANEL';
      if (face !== targetFace) {
        this.audio.playWhiff();
        const err = (this.expectedDirection === 1)
          ? "WRONG STANCE (NEED FOREHAND)"
          : "WRONG STANCE (NEED BACKHAND)";
        this.handleMiss(err, `DETECTED: ${face === 'SCREEN' ? 'FOREHAND' : 'BACKHAND'}`);
        return;
      }

      // Clean Hit Confirmed!
      this.audio.playHit();
      this.updateHUD("CLEAN HIT!", `POWER: ${forceVal.toFixed(1)} [${face}]`);

      if (this.role === 'WALL') {
        setTimeout(() => this.audio.playBounce(), 450);
        setTimeout(() => {
          const nextDir = Math.random() > 0.5 ? 1 : -1;
          this.receiveBall(nextDir, 1.25);
        }, 900);
      } else {
        this.sendPacket({
          type: 'BALL',
          direction: Math.random() > 0.5 ? 1 : -1,
          duration: 1.25
        });
      }
      return;
    }

    this.audio.playWhiff();
  }

  handleMiss(reason, telemetry = "") {
    this.state = 'IDLE';
    clearTimeout(this.missTimeout);
    clearTimeout(this.strikeZoneTimeout);

    this.audio.playBounce();
    this.updateHUD(reason, telemetry);

    if (this.role === 'WALL') {
      this.awardPoint(1);
    } else if (this.role === 'HOST') {
      this.awardPoint(1);
    } else if (this.role === 'GUEST') {
      this.sendPacket({ type: 'GUEST_MISS', reason });
    }
  }

  awardPoint(winner) {
    this.points[winner]++;
    const p1 = this.points[0];
    const p2 = this.points[1];

    let gameWon = false;
    if (p1 >= 4 && p1 >= p2 + 2) {
      this.games[0]++;
      gameWon = true;
    } else if (p2 >= 4 && p2 >= p1 + 2) {
      this.games[1]++;
      gameWon = true;
    }

    if (this.role === 'HOST') {
      this.sendPacket({
        type: 'SYNC',
        points: this.points,
        games: this.games,
        server: this.server,
        gameWon
      });
    }

    if (gameWon) {
      this.points = [0, 0];
      this.server = this.server === 0 ? 1 : 0;
      const str = `Game won. Standings: ${this.games[0]} games to ${this.games[1]}.`;
      this.updateHUD(str);
      this.speak(str, () => this.initiatePoint());
    } else {
      const s = this.getScoreStr();
      this.updateHUD(s);
      this.speak(s, () => this.initiatePoint());
    }
  }
}

/**
 * 4. SYSTEM BOOTSTRAP, CALIBRATION & NETWORKING
 */
const audio = new AudioEngine();
let match = null;
let peer = null;
let conn = null;

// Real-Time Lobby Calibrator Hook
const motion = new SensorFusionMotionEngine(
  (face, force) => {
    if (match) match.onSwing(face, force);
  },
  (stance, power) => {
    // Only update lobby UI if lobby is visible
    const badge = document.getElementById('stanceBadge');
    const bar = document.getElementById('meterBar');
    const pwrText = document.getElementById('testPwr');

    if (badge && document.getElementById('lobby').style.display !== 'none') {
      badge.innerText = stance === 'FOREHAND' ? "FOREHAND STANCE (SCREEN FORWARD)" : "BACKHAND STANCE (BACK PANEL FORWARD)";
      badge.className = "stance-badge " + (stance === 'FOREHAND' ? "forehand" : "backhand");

      if (pwrText) pwrText.innerText = power.toFixed(1) + " m/s²";
      if (bar) {
        const pct = Math.min(100, (power / 15.0) * 100);
        bar.style.width = pct + "%";
        bar.style.background = power >= 7.0 ? "var(--cyan)" : "var(--green)";
      }
    }
  }
);

// 1. Activate & Test Sensors in Lobby
document.getElementById('btnInitSensors').addEventListener('click', async () => {
  const ok = await motion.requestPermission();
  if (ok) {
    motion.start();
    audio.init();
    document.getElementById('btnInitSensors').style.display = 'none';
    document.getElementById('statusText').innerText = "Sensors Active! Try turning your wrist above.";
  } else {
    alert("Motion sensor permission denied.");
  }
});

// Audio Stereo Verification
document.getElementById('btnAudioTest').addEventListener('click', () => {
  const btn = document.getElementById('btnAudioTest');
  btn.innerText = "Playing in LEFT ear...";
  audio.playTestTone(-1, 400, () => {
    btn.innerText = "Playing in RIGHT ear...";
    audio.playTestTone(1, 800, () => {
      btn.innerText = "Verified! (Tap to replay)";
    });
  });
});

function launchGame(title) {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hudMode').innerText = title;

  audio.init();
  motion.start();

  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

// 2. Solo Wall Practice
document.getElementById('btnWall').addEventListener('click', async () => {
  const ok = await motion.requestPermission();
  if (!ok) {
    alert("Motion sensor access required.");
    return;
  }
  launchGame("SOLO WALL PRACTICE");
  match = new TennisMatchController(audio, 'WALL', null, motion);
  match.start();
});

// 3. Create Match (Host)
document.getElementById('btnCreate').addEventListener('click', async () => {
  const ok = await motion.requestPermission();
  if (!ok) return;

  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  document.getElementById('statusText').innerHTML = 
    `ROOM: <b style="color:var(--green); font-size:1.2rem;">${code}</b><br/>Waiting for Player 2...`;

  peer = new Peer('aerotennis-' + code);
  peer.on('connection', (c) => {
    conn = c;
    const onOpen = () => {
      launchGame("1v1 CYBER ARENA (HOST)");
      match = new TennisMatchController(audio, 'HOST', (pkt) => conn.send(pkt), motion);

      conn.on('data', (d) => {
        if (d.type === 'BALL') match.receiveBall(d.direction, d.duration);
        else if (d.type === 'GUEST_MISS') match.awardPoint(0);
      });

      match.start();
    };

    if (conn.open) onOpen();
    else conn.on('open', onOpen);
  });

  peer.on('error', (e) => alert("P2P Error: " + e.type));
});

// 4. Join Match (Guest)
document.getElementById('btnJoin').addEventListener('click', async () => {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (code.length < 4) {
    alert("Enter valid room code.");
    return;
  }
  const ok = await motion.requestPermission();
  if (!ok) return;

  document.getElementById('statusText').innerText = "Connecting...";
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('aerotennis-' + code, { reliable: true });
    const onOpen = () => {
      launchGame("1v1 CYBER ARENA (GUEST)");
      match = new TennisMatchController(audio, 'GUEST', (pkt) => conn.send(pkt), motion);

      conn.on('data', (d) => {
        if (d.type === 'BALL') match.receiveBall(d.direction, d.duration);
        else if (d.type === 'CMD_SERVE') {
          match.server = 1;
          match.initiatePoint();
        } else if (d.type === 'SYNC') {
          match.points = d.points;
          match.games = d.games;
          match.server = d.server;
          match.updateHUD();
        }
      });
    };

    if (conn.open) onOpen();
    else conn.on('open', onOpen);
  });

  peer.on('error', () => alert("Could not find room code."));
});

document.getElementById('btnQuit').addEventListener('click', () => window.location.reload());
</script>
