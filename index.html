<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroTennis | Cyberpunk Audio Sport</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-cyan: #00ffff;
            --neon-red: #ff0055;
            --bg-dark: #0a0a0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            text-align: center;
        }
        h1 { color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-cyan); }
        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        
        button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 30px;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            transition: 0.3s;
        }
        button:hover, button:active { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); }
        input {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
            outline: none;
        }
        .status { margin-top: 20px; color: var(--neon-cyan); font-size: 1.2rem; font-weight: bold; min-height: 30px;}
        .feedback { color: var(--neon-red); font-size: 1rem; margin-top: 10px; min-height: 25px; }
        .score-board { font-size: 3rem; color: var(--neon-green); margin-bottom: 10px; letter-spacing: 2px; text-shadow: 0 0 15px var(--neon-green); }
        .warning { color: var(--neon-red); margin-bottom: 15px; font-size: 0.9rem; }
        .instructions { margin-top: 40px; font-size: 0.85rem; color: #888; border: 1px solid #333; padding: 15px; border-radius: 5px; text-align: left;}
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menuScreen" class="screen active">
        <h1>AeroTennis</h1>
        <p class="warning">⚠️ STEREO HEADPHONES STRICTLY MANDATORY</p>
        <button onclick="startGame(true)">Wall Mode (Practice)</button>
        <button onclick="showMultiplayer()">Multiplayer</button>
        <div class="instructions">
            <strong>HOW TO PLAY:</strong><br><br>
            1. Hold phone horizontally in one hand.<br>
            2. <strong>Left Ear Sound:</strong> Screen must face YOU. Swing forward.<br>
            3. <strong>Right Ear Sound:</strong> Screen must face AWAY. Swing forward.<br>
            4. Swing when the sound is loudest!
        </div>
    </div>

    <!-- MULTIPLAYER LOBBY -->
    <div id="lobbyScreen" class="screen">
        <h1>Net-Link</h1>
        <button onclick="createMatch()">Create Match</button>
        <p style="margin: 15px 0;">OR</p>
        <input type="text" id="joinCode" placeholder="Enter 6-Digit Code" maxlength="6">
        <button onclick="joinMatch()">Join Match</button>
        <button onclick="switchScreen('menuScreen')" style="border-color: gray; color: gray; box-shadow: none;">Cancel</button>
        <p id="lobbyStatus" class="status"></p>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="gameScreen" class="screen">
        <div class="score-board" id="scoreBoard">0 - 0</div>
        <p id="gameStatus" class="status">Initializing...</p>
        <p id="gameFeedback" class="feedback"></p> <!-- Added specific debug feedback -->
    </div>

<script>
/**
 * UI & WAKE LOCK ARCHITECTURE
 */
const UI = {
    switch: (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    },
    setStatus: (text) => document.getElementById('gameStatus').innerText = text,
    setFeedback: (text) => document.getElementById('gameFeedback').innerText = text,
    setScore: (p1, p2) => document.getElementById('scoreBoard').innerText = `${p1} - ${p2}`,
    setLobbyStatus: (text) => document.getElementById('lobbyStatus').innerText = text
};

function switchScreen(id) { UI.switch(id); }

let wakeLock = null;
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } 
        catch (err) { console.error('Wake Lock error:', err); }
    }
}
document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
});

/**
 * AUDIO ENGINE
 */
class AudioEngine {
    constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    async init() { if (this.ctx.state === 'suspended') await this.ctx.resume(); }

    speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05; utterance.pitch = 0.9;
        speechSynthesis.speak(utterance);
    }

    playBallApproach(side, durationMs) {
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();
        const panner = this.ctx.createStereoPanner();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + (durationMs / 1000));

        panner.pan.value = side;

        gainNode.gain.setValueAtTime(0.01, this.ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(1, this.ctx.currentTime + (durationMs / 1000) - 0.1);
        gainNode.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (durationMs / 1000));

        osc.connect(panner); panner.connect(gainNode); gainNode.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + (durationMs / 1000));
    }

    playSFX(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        
        const now = this.ctx.currentTime;
        if (type === 'perfect') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'poor') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'miss') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }
}
const audio = new AudioEngine();

/**
 * PRODUCTION MOTION ENGINE (Fixed Physics Bug)
 */
class MotionEngine {
    constructor(onSwing) {
        this.onSwing = onSwing;
        this.lastSwingTime = 0;
        this.restingZGravity = 0; // Tracks orientation BEFORE the violent swing
    }

    async requestPermissions() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceMotionEvent.requestPermission();
                if (permission !== 'granted') throw new Error("Permission denied");
            } catch (e) {
                alert("Motion permissions are required to play!");
                return false;
            }
        }
        this.startListening();
        return true;
    }

    startListening() {
        window.addEventListener('devicemotion', (e) => {
            if (!e.acceleration || !e.accelerationIncludingGravity) return;
            
            // Calculate pure swing force
            const force = Math.sqrt(e.acceleration.x**2 + e.acceleration.y**2 + e.acceleration.z**2);

            // FIX: Only update resting orientation when the phone is relatively still.
            // This prevents the swing force from overriding the gravity reading.
            if (force < 3) {
                this.restingZGravity = e.accelerationIncludingGravity.z;
            }

            // Detect Swing (Lowered threshold slightly for better responsiveness)
            if (force > 12 && Date.now() - this.lastSwingTime > 1000) {
                this.lastSwingTime = Date.now();
                // Positive Z generally means screen facing user. Negative means screen facing away.
                const isScreenFacingUser = this.restingZGravity > 0;
                this.onSwing(isScreenFacingUser);
            }
        });
    }
}

/**
 * GAME LOGIC ENGINE
 */
class GameEngine {
    constructor(isHost, isPractice) {
        this.isHost = isHost;
        this.isPractice = isPractice;
        this.scores = { host: 0, guest: 0 };
        
        this.state = 'IDLE'; 
        this.server = 'host';
        this.ballInFlight = false;
        this.expectedSide = null; // -1 (Left/Screen towards you), 1 (Right/Screen away)
        this.ballArrivalTime = 0;
        
        this.motion = new MotionEngine(this.handleSwing.bind(this));
    }

    async init() {
        await audio.init();
        await requestWakeLock();
        const motionGranted = await this.motion.requestPermissions();
        if (motionGranted) {
            UI.switch('gameScreen');
            UI.setFeedback(""); // Clear feedback
            setTimeout(() => this.announceScoreAndServe(), 1000);
        }
    }

    announceScoreAndServe() {
        let text = (this.scores.host === 40 && this.scores.guest === 40) 
            ? "Deuce." 
            : `${this.scores.host} - ${this.scores.guest}.`;
        
        let isMyServe = this.server === (this.isHost ? 'host' : 'guest') || this.isPractice;
        let serverText = isMyServe ? "Your turn to serve." : "Opponent to serve.";

        audio.speak(`${text} ${serverText}`);
        UI.setStatus(serverText);

        setTimeout(() => {
            this.state = 'SERVING';
            if (isMyServe) {
                UI.setStatus("Swing forward to Serve!");
                UI.setFeedback(""); 
            }
        }, 3000);
    }

    handleSwing(isScreenFacingUser) {
        let isMyServe = this.server === (this.isHost ? 'host' : 'guest') || this.isPractice;

        if (this.state === 'SERVING' && isMyServe) {
            this.state = 'IN_PLAY';
            UI.setFeedback("");
            this.hitBall('perfect');
            return;
        }

        if (this.state === 'IN_PLAY' && this.ballInFlight) {
            const timeNow = Date.now();
            const timeDiff = timeNow - this.ballArrivalTime; // Negative = Early, Positive = Late
            const absoluteDiff = Math.abs(timeDiff);
            
            // Left (-1) requires Screen Facing User (true)
            // Right (1) requires Screen Facing Away (false)
            const sideCorrect = (this.expectedSide === -1 && isScreenFacingUser) || 
                                (this.expectedSide === 1 && !isScreenFacingUser);
            
            // 600ms sweet spot (very forgiving)
            if (absoluteDiff < 600) { 
                if (sideCorrect) {
                    let quality = absoluteDiff < 250 ? 'perfect' : 'poor';
                    this.hitBall(quality);
                } else {
                    let faceDir = isScreenFacingUser ? "YOU" : "AWAY";
                    UI.setFeedback(`Miss! Wrong side. Screen was facing ${faceDir}`);
                    this.missBall();
                }
            } else {
                if (timeDiff < -600) UI.setFeedback("Miss! Swung too EARLY.");
                else if (timeDiff > 600) UI.setFeedback("Miss! Swung too LATE.");
                this.missBall();
            }
        }
    }

    hitBall(quality) {
        this.ballInFlight = false;
        audio.playSFX(quality);
        UI.setStatus("HIT!");
        UI.setFeedback(quality === 'perfect' ? "Perfect timing!" : "Good hit.");
        
        const nextSide = Math.random() > 0.5 ? -1 : 1; 

        if (this.isPractice) {
            setTimeout(() => this.receiveBall(nextSide), 1000);
        } else {
            network.send({ type: 'HIT', side: nextSide });
        }
    }

    receiveBall(side) {
        this.state = 'IN_PLAY';
        this.ballInFlight = true;
        this.expectedSide = side;
        
        const travelTime = 1500; // Slightly slower ball for better reaction time
        this.ballArrivalTime = Date.now() + travelTime;
        
        audio.playBallApproach(side, travelTime);
        let sideText = side === -1 ? "LEFT (Face Screen to YOU)" : "RIGHT (Face Screen AWAY)";
        UI.setStatus(`Ball approaching ${sideText}`);
        UI.setFeedback(""); // Clear previous feedback
        
        // Auto-miss if player doesn't swing at all
        setTimeout(() => {
            if (this.ballInFlight) {
                UI.setFeedback("Miss! You didn't swing.");
                this.missBall();
            }
        }, travelTime + 700); 
    }

    missBall() {
        if (!this.ballInFlight) return;
        this.ballInFlight = false;
        audio.playSFX('miss');
        
        const winner = this.server === (this.isHost ? 'host' : 'guest') ? 'guest' : 'host';
        this.awardPoint(winner);
    }

    awardPoint(player) {
        this.state = 'IDLE';
        
        if (this.scores[player] === 30) this.scores[player] = 40;
        else if (this.scores[player] === 40) {
            UI.setStatus("GAME OVER");
            UI.setFeedback("");
            audio.speak("Game.");
            setTimeout(() => location.reload(), 4000);
            return;
        } else {
            this.scores[player] += 15;
        }

        UI.setScore(this.scores.host, this.scores.guest);
        
        if (!this.isPractice) {
            network.send({ type: 'SCORE', scores: this.scores });
        }
        
        this.server = this.server === 'host' ? 'guest' : 'host';
        setTimeout(() => this.announceScoreAndServe(), 2500);
    }
}

/**
 * MULTIPLAYER ENGINE (STUN Enabled)
 */
let network = null;
let game = null;

class Multiplayer {
    constructor() {
        this.myId = Math.floor(100000 + Math.random() * 900000).toString();
        
        this.peer = new Peer(this.myId, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        
        this.conn = null;
        this.isReady = false;
        
        this.peer.on('open', (id) => {
            this.isReady = true;
            if(document.getElementById('lobbyStatus').innerText === "Generating secure code...") {
                UI.setLobbyStatus(`Share this code: ${this.myId}`);
            }
        });

        this.peer.on('error', (err) => {
            let errMsg = "Connection Failed.";
            if (err.type === 'peer-unavailable') errMsg = "Code not found! Check code.";
            UI.setLobbyStatus(errMsg);
        });

        this.peer.on('connection', (connection) => {
            this.conn = connection;
            this.setupConnection(true);
        });
    }

    connect(peerId) {
        if (!this.isReady) {
            UI.setLobbyStatus("Still connecting to server...");
            return;
        }
        this.conn = this.peer.connect(peerId, { reliable: true });
        this.setupConnection(false);
    }

    setupConnection(isHost) {
        this.conn.on('open', () => {
            UI.setLobbyStatus("Connected! Starting game...");
            setTimeout(() => {
                game = new GameEngine(isHost, false);
                game.init();
            }, 1000);
        });

        this.conn.on('data', (data) => {
            if (data.type === 'HIT') game.receiveBall(data.side);
            else if (data.type === 'SCORE') {
                game.scores = data.scores;
                UI.setScore(game.scores.host, game.scores.guest);
            }
        });
    }

    send(data) {
        if (this.conn && this.conn.open) this.conn.send(data);
    }
}

/**
 * UI BINDINGS
 */
function startGame(isPractice) {
    if (isPractice) {
        game = new GameEngine(true, true);
        game.init();
    }
}

function showMultiplayer() {
    UI.switch('lobbyScreen');
    if (!network) {
        UI.setLobbyStatus("Connecting to multiplayer server...");
        network = new Multiplayer();
        setTimeout(() => { if(network.isReady) UI.setLobbyStatus(""); }, 1000);
    }
}

function createMatch() {
    if (network && network.isReady) UI.setLobbyStatus(`Share this code: ${network.myId}`);
    else UI.setLobbyStatus("Generating secure code...");
}

function joinMatch() {
    const code = document.getElementById('joinCode').value;
    if (code.length === 6) {
        UI.setLobbyStatus("Finding opponent...");
        network.connect(code);
    } else UI.setLobbyStatus("Please enter a 6-digit code.");
}
</script>
</body>
</html>
